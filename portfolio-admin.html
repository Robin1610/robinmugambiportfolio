<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Admin — Robin Mugambi</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--a1:#6b7fd4;--a2:#c97ea8;--a3:#7ec8e3;--a4:#a78bca;--bg:#f0f4fa;--surface:#fff;--text:#2c3a5a;--muted:#6b7a96;--border:rgba(107,127,212,0.18);--radius:12px}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(107,127,212,.08)}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.1rem;color:var(--a1)}
.logo span{color:var(--text)}
.export-btn{background:linear-gradient(135deg,var(--a1),var(--a4));color:#fff;border:none;padding:.65rem 1.5rem;border-radius:8px;font-family:'Syne',sans-serif;font-weight:700;font-size:.85rem;cursor:pointer;transition:opacity .2s;display:flex;align-items:center;gap:.5rem}
.export-btn:hover{opacity:.88}
.import-btn{background:var(--surface);color:var(--a1);border:1.5px solid var(--a1);padding:.6rem 1.2rem;border-radius:8px;font-family:'Syne',sans-serif;font-weight:600;font-size:.82rem;cursor:pointer;transition:background .2s}
.import-btn:hover{background:rgba(107,127,212,.06)}
.hdr-btns{display:flex;gap:.7rem;align-items:center}
main{max-width:900px;margin:0 auto;padding:2rem 1.5rem}
.section-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-bottom:1.5rem;overflow:hidden}
.section-head{padding:1.1rem 1.4rem;display:flex;align-items:center;justify-content:space-between;cursor:pointer;border-bottom:1px solid transparent;transition:background .2s}
.section-head:hover{background:rgba(107,127,212,.04)}
.section-head.open{border-bottom-color:var(--border)}
.section-title{font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;color:var(--text);display:flex;align-items:center;gap:.6rem}
.section-badge{background:rgba(107,127,212,.1);color:var(--a1);font-size:.7rem;font-weight:700;padding:.2rem .55rem;border-radius:100px;letter-spacing:.05em}
.chevron{font-size:.8rem;color:var(--muted);transition:transform .25s}
.chevron.open{transform:rotate(180deg)}
.section-body{display:none;padding:1.2rem 1.4rem}
.section-body.open{display:block}
label{display:block;font-size:.78rem;font-weight:500;color:var(--muted);margin-bottom:.3rem;letter-spacing:.03em;text-transform:uppercase}
input[type=text],input[type=email],input[type=tel],textarea,select{width:100%;padding:.7rem .9rem;border:1.5px solid var(--border);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.88rem;color:var(--text);background:var(--bg);outline:none;transition:border-color .2s}
input:focus,textarea:focus,select:focus{border-color:var(--a1)}
textarea{resize:vertical;min-height:80px;line-height:1.6}
.field{margin-bottom:1rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.8rem}
.add-btn{display:inline-flex;align-items:center;gap:.4rem;background:none;border:1.5px dashed var(--border);border-radius:8px;padding:.55rem 1rem;font-family:'DM Sans',sans-serif;font-size:.82rem;color:var(--a1);cursor:pointer;width:100%;justify-content:center;margin-top:.5rem;transition:background .2s,border-color .2s}
.add-btn:hover{background:rgba(107,127,212,.05);border-color:var(--a1)}
.item-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:1rem;margin-bottom:.8rem;position:relative}
.item-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem}
.item-num{font-family:'Syne',sans-serif;font-weight:700;font-size:.78rem;color:var(--a1)}
.del-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:.2rem .4rem;border-radius:4px;transition:color .2s,background .2s}
.del-btn:hover{color:#e05555;background:rgba(224,85,85,.08)}
.bullet-list{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.5rem}
.bullet-row{display:flex;gap:.5rem;align-items:center}
.bullet-row input{flex:1}
.bullet-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.9rem;flex-shrink:0;padding:.3rem;border-radius:4px;transition:color .2s}
.bullet-del:hover{color:#e05555}
.add-bullet{background:none;border:none;color:var(--a1);cursor:pointer;font-size:.8rem;font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:.3rem;padding:.3rem 0}
.add-bullet:hover{opacity:.75}
.tag-wrap{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.5rem}
.tag-chip{display:inline-flex;align-items:center;gap:.3rem;background:rgba(107,127,212,.1);border:1px solid rgba(107,127,212,.25);color:var(--a1);border-radius:100px;padding:.22rem .7rem;font-size:.78rem}
.tag-chip button{background:none;border:none;cursor:pointer;color:var(--a1);font-size:.85rem;line-height:1;padding:0}
.tag-input-row{display:flex;gap:.4rem}
.tag-input-row input{flex:1}
.tag-add-btn{background:var(--a1);color:#fff;border:none;border-radius:6px;padding:.5rem .9rem;font-size:.8rem;cursor:pointer;white-space:nowrap;transition:opacity .2s}
.tag-add-btn:hover{opacity:.85}
.color-row{display:flex;gap:.8rem;align-items:flex-end}
.color-field{flex:1}
.color-preview{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);cursor:pointer;flex-shrink:0;margin-bottom:.1rem}
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:#2c3a5a;color:#fff;padding:.75rem 1.3rem;border-radius:10px;font-size:.85rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9999}
.toast.show{opacity:1}
.hint{font-size:.75rem;color:var(--muted);margin-top:.3rem;line-height:1.4}
</style>
</head>
<body>
<header>
  <div class="logo">RM. <span>Portfolio Admin</span></div>
  <div class="hdr-btns">
    <button class="import-btn" onclick="importJSON()">&#128194; Import JSON</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="handleImport(event)">
    <button class="export-btn" onclick="exportJSON()">&#11123; Export JSON</button>
  </div>
</header>

<main>

  <!-- HERO -->
  <div class="section-card">
    <div class="section-head" onclick="toggle(this)">
      <div class="section-title">&#127968; Hero Section <span class="section-badge">Text & Intro</span></div>
      <span class="chevron">&#9660;</span>
    </div>
    <div class="section-body">
      <div class="row">
        <div class="field"><label>Badge text</label><input type="text" id="hero-badge" placeholder="Come Have a Look!"></div>
        <div class="field"><label>Subtitle</label><input type="text" id="hero-subtitle" placeholder="IT Support Professional → ..."></div>
      </div>
      <div class="field"><label>Hero prose</label><textarea id="hero-prose" rows="4" placeholder="Hello World..."></textarea><div class="hint">Use a blank line between paragraphs. The PS line can start with "PS:"</div></div>
    </div>
  </div>

  <!-- CONTACT -->
  <div class="section-card">
    <div class="section-head" onclick="toggle(this)">
      <div class="section-title">&#128222; Contact Details <span class="section-badge">Links & Info</span></div>
      <span class="chevron">&#9660;</span>
    </div>
    <div class="section-body">
      <div class="row3">
        <div class="field"><label>Email</label><input type="email" id="contact-email" placeholder="you@email.com"></div>
        <div class="field"><label>LinkedIn URL</label><input type="text" id="contact-linkedin" placeholder="https://linkedin.com/in/..."></div>
        <div class="field"><label>Phone</label><input type="tel" id="contact-phone" placeholder="+254..."></div>
      </div>
    </div>
  </div>

  <!-- TOOLS -->
  <div class="section-card">
    <div class="section-head" onclick="toggle(this)">
      <div class="section-title">&#128295; Tools & Systems <span class="section-badge" id="tools-count">0 cards</span></div>
      <span class="chevron">&#9660;</span>
    </div>
    <div class="section-body">
      <div id="tools-list"></div>
      <button class="add-btn" onclick="addTool()">&#43; Add tool card</button>
    </div>
  </div>

  <!-- TIMELINE -->
  <div class="section-card">
    <div class="section-head" onclick="toggle(this)">
      <div class="section-title">&#128640; Career Timeline <span class="section-badge" id="timeline-count">0 roles</span></div>
      <span class="chevron">&#9660;</span>
    </div>
    <div class="section-body">
      <div id="timeline-list"></div>
      <button class="add-btn" onclick="addRole()">&#43; Add career role</button>
    </div>
  </div>

  <!-- SKILLS -->
  <div class="section-card">
    <div class="section-head" onclick="toggle(this)">
      <div class="section-title">&#127775; Skills <span class="section-badge" id="skills-count">0 groups</span></div>
      <span class="chevron">&#9660;</span>
    </div>
    <div class="section-body">
      <div id="skills-list"></div>
      <button class="add-btn" onclick="addSkillGroup()">&#43; Add skill group</button>
    </div>
  </div>

  <!-- CERTS -->
  <div class="section-card">
    <div class="section-head" onclick="toggle(this)">
      <div class="section-title">&#127891; Certifications <span class="section-badge" id="certs-count">0 certs</span></div>
      <span class="chevron">&#9660;</span>
    </div>
    <div class="section-body">
      <div id="certs-list"></div>
      <button class="add-btn" onclick="addCert()">&#43; Add certification</button>
    </div>
  </div>

</main>

<div class="toast" id="toast"></div>

<script>
/* ── State ── */
var state = {
  hero: { badge:'', subtitle:'', prose:'' },
  contact: { email:'', linkedin:'', phone:'' },
  tools: [],
  timeline: [],
  skills: [],
  certifications: []
};

/* ── Accordion ── */
function toggle(head){
  var body = head.nextElementSibling;
  var chev = head.querySelector('.chevron');
  var isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  head.classList.toggle('open', !isOpen);
  chev.classList.toggle('open', !isOpen);
}

/* ── Toast ── */
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');}, 2500);
}

/* ── Colour helpers ── */
var COLORS = ['#6b7fd4','#c97ea8','#7ec8e3','#a78bca','#7ec8e3','#c97ea8'];
function nextColor(i){ return COLORS[i % COLORS.length]; }

/* ── Hero ── */
function loadHero(h){
  document.getElementById('hero-badge').value    = h.badge    || '';
  document.getElementById('hero-subtitle').value = h.subtitle || '';
  document.getElementById('hero-prose').value    = h.prose    || '';
}
function readHero(){
  return {
    badge:    document.getElementById('hero-badge').value.trim(),
    subtitle: document.getElementById('hero-subtitle').value.trim(),
    prose:    document.getElementById('hero-prose').value.trim()
  };
}

/* ── Contact ── */
function loadContact(c){
  document.getElementById('contact-email').value    = c.email    || '';
  document.getElementById('contact-linkedin').value = c.linkedin || '';
  document.getElementById('contact-phone').value    = c.phone    || '';
}
function readContact(){
  return {
    email:    document.getElementById('contact-email').value.trim(),
    linkedin: document.getElementById('contact-linkedin').value.trim(),
    phone:    document.getElementById('contact-phone').value.trim()
  };
}

/* ── TOOLS ── */
function renderTools(){
  var list = document.getElementById('tools-list');
  list.innerHTML = '';
  state.tools.forEach(function(t, i){ list.appendChild(toolCard(t, i)); });
  document.getElementById('tools-count').textContent = state.tools.length + ' cards';
}
function toolCard(t, i){
  var div = document.createElement('div'); div.className = 'item-card';
  div.innerHTML =
    '<div class="item-card-head"><span class="item-num">Card '+(i+1)+'</span><button class="del-btn" onclick="delTool('+i+')">&#128465;</button></div>'+
    '<div class="row3">'+
      '<div class="field"><label>Icon (emoji)</label><input type="text" value="'+esc(t.icon||'')+'" oninput="state.tools['+i+'].icon=this.value" placeholder="☁️" maxlength="4"></div>'+
      '<div class="field"><label>Name</label><input type="text" value="'+esc(t.name||'')+'" oninput="state.tools['+i+'].name=this.value" placeholder="Microsoft 365"></div>'+
      '<div class="field"><label>Category (tag)</label><input type="text" value="'+esc(t.category||'')+'" oninput="state.tools['+i+'].category=this.value" placeholder="Cloud Admin"></div>'+
    '</div>'+
    '<div class="field"><label>Description (shown on flip)</label><textarea oninput="state.tools['+i+'].description=this.value" rows="2" placeholder="What you use this tool for...">'+esc(t.description||'')+'</textarea></div>'+
    '<div class="color-row">'+
      '<div class="color-field"><label>Accent colour 1</label><input type="text" value="'+esc(t.color1||'#6b7fd4')+'" oninput="state.tools['+i+'].color1=this.value;this.nextElementSibling.style.background=this.value"><div class="color-preview" style="background:'+(t.color1||'#6b7fd4')+'" onclick="this.previousElementSibling.click()"></div></div>'+
      '<div class="color-field"><label>Accent colour 2</label><input type="text" value="'+esc(t.color2||'#a78bca')+'" oninput="state.tools['+i+'].color2=this.value;this.nextElementSibling.style.background=this.value"><div class="color-preview" style="background:'+(t.color2||'#a78bca')+'" onclick="this.previousElementSibling.click()"></div></div>'+
    '</div>';
  return div;
}
function addTool(){
  var i = state.tools.length;
  state.tools.push({icon:'🔧',name:'',category:'',description:'',color1:nextColor(i),color2:nextColor(i+2)});
  renderTools();
}
function delTool(i){ if(confirm('Remove this tool card?')){ state.tools.splice(i,1); renderTools(); } }

/* ── TIMELINE ── */
function renderTimeline(){
  var list = document.getElementById('timeline-list');
  list.innerHTML = '';
  state.timeline.forEach(function(r, i){ list.appendChild(roleCard(r, i)); });
  document.getElementById('timeline-count').textContent = state.timeline.length + ' roles';
}
function roleCard(r, i){
  var div = document.createElement('div'); div.className = 'item-card';
  var bulletsHtml = (r.bullets||[]).map(function(b, bi){
    return '<div class="bullet-row"><input type="text" value="'+esc(b)+'" oninput="state.timeline['+i+'].bullets['+bi+']=this.value" placeholder="Bullet point..."><button class="bullet-del" onclick="delBullet('+i+','+bi+')">&#10005;</button></div>';
  }).join('');
  div.innerHTML =
    '<div class="item-card-head"><span class="item-num">Role '+(i+1)+'</span><button class="del-btn" onclick="delRole('+i+')">&#128465;</button></div>'+
    '<div class="row">'+
      '<div class="field"><label>Emoji</label><input type="text" value="'+esc(r.emoji||'')+'" oninput="state.timeline['+i+'].emoji=this.value" placeholder="🚀" maxlength="4"></div>'+
      '<div class="field"><label>Year</label><input type="text" value="'+esc(r.year||'')+'" oninput="state.timeline['+i+'].year=this.value" placeholder="2026"></div>'+
    '</div>'+
    '<div class="row">'+
      '<div class="field"><label>Company (short, line 1)</label><input type="text" value="'+esc(r.company||'')+'" oninput="state.timeline['+i+'].company=this.value" placeholder="Service Park"></div>'+
      '<div class="field"><label>Company line 2 (optional)</label><input type="text" value="'+esc(r.company2||'')+'" oninput="state.timeline['+i+'].company2=this.value" placeholder="Technologies"></div>'+
    '</div>'+
    '<div class="row">'+
      '<div class="field"><label>Role / Job title</label><input type="text" value="'+esc(r.role||'')+'" oninput="state.timeline['+i+'].role=this.value" placeholder="IT Support Technician"></div>'+
      '<div class="field"><label>Date range</label><input type="text" value="'+esc(r.date||'')+'" oninput="state.timeline['+i+'].date=this.value" placeholder="Feb 2026 – Present"></div>'+
    '</div>'+
    '<div class="field"><label>Full company name & location</label><input type="text" value="'+esc(r.fullCompany||'')+'" oninput="state.timeline['+i+'].fullCompany=this.value" placeholder="Service Park Technologies · Nairobi"></div>'+
    '<div class="field"><label>Bullet points</label><div class="bullet-list" id="bullets-'+i+'">'+bulletsHtml+'</div>'+
    '<button class="add-bullet" onclick="addBullet('+i+')">&#43; Add bullet</button></div>'+
    '<div class="color-row">'+
      '<div class="color-field"><label>Colour 1</label><input type="text" value="'+esc(r.color1||'#6b7fd4')+'" oninput="state.timeline['+i+'].color1=this.value;this.nextElementSibling.style.background=this.value"><div class="color-preview" style="background:'+(r.color1||'#6b7fd4')+'"></div></div>'+
      '<div class="color-field"><label>Colour 2</label><input type="text" value="'+esc(r.color2||'#a78bca')+'" oninput="state.timeline['+i+'].color2=this.value;this.nextElementSibling.style.background=this.value"><div class="color-preview" style="background:'+(r.color2||'#a78bca')+'"></div></div>'+
    '</div>';
  return div;
}
function addRole(){
  var anims=['ufoA','ufoB','ufoC','ufoD'];
  var durs=['7.5s','9s','8.2s','10s'];
  var dls=['0s','1.8s','3.5s','0.9s'];
  var i=state.timeline.length;
  state.timeline.push({emoji:'🚀',company:'',company2:'',year:'',date:'',role:'',fullCompany:'',color1:nextColor(i),color2:nextColor(i+2),bullets:[]});
  renderTimeline();
}
function delRole(i){ if(confirm('Remove this role?')){ state.timeline.splice(i,1); renderTimeline(); } }
function addBullet(i){ state.timeline[i].bullets.push(''); renderTimeline(); }
function delBullet(i,bi){ state.timeline[i].bullets.splice(bi,1); renderTimeline(); }

/* ── SKILLS ── */
function renderSkills(){
  var list = document.getElementById('skills-list');
  list.innerHTML = '';
  state.skills.forEach(function(g, i){ list.appendChild(skillGroupCard(g, i)); });
  document.getElementById('skills-count').textContent = state.skills.length + ' groups';
}
function skillGroupCard(g, i){
  var div = document.createElement('div'); div.className = 'item-card';
  var tagsHtml = (g.tags||[]).map(function(tag, ti){
    return '<span class="tag-chip">'+esc(tag)+'<button onclick="delTag('+i+','+ti+')">&#10005;</button></span>';
  }).join('');
  div.innerHTML =
    '<div class="item-card-head"><span class="item-num">Group '+(i+1)+'</span><button class="del-btn" onclick="delSkillGroup('+i+')">&#128465;</button></div>'+
    '<div class="row">'+
      '<div class="field"><label>Icon (emoji)</label><input type="text" value="'+esc(g.icon||'')+'" oninput="state.skills['+i+'].icon=this.value" placeholder="☁️" maxlength="4"></div>'+
      '<div class="field"><label>Group name</label><input type="text" value="'+esc(g.group||'')+'" oninput="state.skills['+i+'].group=this.value" placeholder="Microsoft Cloud & Endpoint"></div>'+
    '</div>'+
    '<div class="field"><label>Skill tags</label><div class="tag-wrap" id="tags-'+i+'">'+tagsHtml+'</div>'+
    '<div class="tag-input-row"><input type="text" id="tag-input-'+i+'" placeholder="Type a skill and press Add" onkeydown="if(event.key===\'Enter\'){addTag('+i+');event.preventDefault()}"><button class="tag-add-btn" onclick="addTag('+i+')">Add</button></div></div>';
  return div;
}
function addSkillGroup(){ state.skills.push({icon:'',group:'',tags:[]}); renderSkills(); }
function delSkillGroup(i){ if(confirm('Remove this group?')){ state.skills.splice(i,1); renderSkills(); } }
function addTag(i){ var inp=document.getElementById('tag-input-'+i); var v=inp.value.trim(); if(!v)return; state.skills[i].tags.push(v); inp.value=''; renderSkills(); }
function delTag(i,ti){ state.skills[i].tags.splice(ti,1); renderSkills(); }

/* ── CERTS ── */
function renderCerts(){
  var list = document.getElementById('certs-list');
  list.innerHTML = '';
  state.certifications.forEach(function(c, i){ list.appendChild(certCard(c, i)); });
  document.getElementById('certs-count').textContent = state.certifications.length + ' certs';
}
function certCard(c, i){
  var div = document.createElement('div'); div.className = 'item-card';
  div.innerHTML =
    '<div class="item-card-head"><span class="item-num">Cert '+(i+1)+'</span><button class="del-btn" onclick="delCert('+i+')">&#128465;</button></div>'+
    '<div class="row">'+
      '<div class="field"><label>Icon (emoji)</label><input type="text" value="'+esc(c.icon||'')+'" oninput="state.certifications['+i+'].icon=this.value" placeholder="📘" maxlength="4"></div>'+
      '<div class="field"><label>Name</label><input type="text" value="'+esc(c.name||'')+'" oninput="state.certifications['+i+'].name=this.value" placeholder="Kaseya Certified Technician"></div>'+
    '</div>'+
    '<div class="field"><label>Description (shown on flip)</label><textarea oninput="state.certifications['+i+'].description=this.value" rows="2" placeholder="What this certification covers...">'+esc(c.description||'')+'</textarea></div>';
  return div;
}
function addCert(){ state.certifications.push({icon:'📜',name:'',description:''}); renderCerts(); }
function delCert(i){ if(confirm('Remove this certification?')){ state.certifications.splice(i,1); renderCerts(); } }

/* ── Escape helper ── */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ── Load state into UI ── */
function loadAll(data){
  if(data.hero)       { state.hero=data.hero;              loadHero(data.hero); }
  if(data.contact)    { state.contact=data.contact;         loadContact(data.contact); }
  if(data.tools)      { state.tools=data.tools;             renderTools(); }
  if(data.timeline)   { state.timeline=data.timeline;       renderTimeline(); }
  if(data.skills)     { state.skills=data.skills;           renderSkills(); }
  if(data.certifications){ state.certifications=data.certifications; renderCerts(); }
}

/* ── Collect all state before export ── */
function collectAll(){
  state.hero    = readHero();
  state.contact = readContact();
  /* tools/timeline/skills/certs update live via oninput */
  return state;
}

/* ── Export JSON ── */
function exportJSON(){
  var data = collectAll();
  var json = JSON.stringify(data, null, 2);
  var blob = new Blob([json], {type:'application/json'});
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href = url; a.download = 'portfolio-data.json';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
  toast('portfolio-data.json downloaded! Place it in the same folder as your portfolio HTML.');
}

/* ── Import JSON ── */
function importJSON(){ document.getElementById('importFile').click(); }
function handleImport(e){
  var file = e.target.files[0]; if(!file)return;
  var reader = new FileReader();
  reader.onload = function(ev){
    try{
      var data = JSON.parse(ev.target.result);
      loadAll(data);
      toast('Imported successfully — ' + file.name);
    } catch(err){
      alert('Could not parse JSON: ' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}
