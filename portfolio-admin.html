<!DOCTYPE html>
<html>
<body>
<h3>Edit Harmonograph</h3>
<input id="f1" placeholder="f1">
<input id="f2" placeholder="f2">
<button onclick="save()">Save</button>
<script>
function save(){
 fetch('portfolio-data.json').then(r=>r.json()).then(d=>{
  d.projects[0].harmonograph.f1=parseFloat(f1.value)||2;
  d.projects[0].harmonograph.f2=parseFloat(f2.value)||3;
  console.log("Update JSON manually with:",JSON.stringify(d,null,2));
 });
}
</script>
</body>
</html>
