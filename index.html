<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Portfolio</title>
<style>
.pjwrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.pjsvg-wrap{width:120px;height:120px;transition:.3s}
.pjwrap:hover .pjsvg-wrap{transform:scale(1.1)}
</style>
</head>
<body>
<div id="projects"></div>
<script>
function generateHarmonograph(p,size,c1,c2){
 const ns="http://www.w3.org/2000/svg";
 const svg=document.createElementNS(ns,"svg");
 svg.setAttribute("viewBox","0 0 "+size+" "+size);
 let path="";
 for(let i=0;i<500;i++){
  let t=i*0.05;
  let x=size/2+Math.sin(t*p.f1+p.p1)*40*Math.exp(-0.002*i);
  let y=size/2+Math.sin(t*p.f2+p.p2)*40*Math.exp(-0.002*i);
  path+=(i?"L":"M")+x+" "+y+" ";
 }
 const el=document.createElementNS(ns,"path");
 el.setAttribute("d",path);
 el.setAttribute("fill","none");
 el.setAttribute("stroke",c1);
 svg.appendChild(el);
 return svg;
}
function animate(el,speed,intensity){
 let t=0;
 function loop(){
  el.style.transform=`scale(${1+Math.sin(t)*intensity})`;
  t+=speed;
  requestAnimationFrame(loop);
 }
 loop();
}
fetch('portfolio-data.json').then(r=>r.json()).then(d=>{
 const root=document.getElementById('projects');
 d.projects.forEach(p=>{
  const wrap=document.createElement('div');wrap.className='pjwrap';
  const svgWrap=document.createElement('div');svgWrap.className='pjsvg-wrap';
  const svg=generateHarmonograph(p.harmonograph,120,p.color1,p.color2);
  svgWrap.appendChild(svg);
  wrap.appendChild(svgWrap);
  const name=document.createElement('div');name.textContent=p.name;
  wrap.appendChild(name);
  animate(svg,p.motion?.speed||0.03,p.motion?.intensity||0.03);
  root.appendChild(wrap);
 });
});
</script>
</body>
</html>
